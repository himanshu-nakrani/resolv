[project]
name = "resolv"
version = "0.1.0"
description = "Turn a bug report into a reproduced, validated, reviewable patch for Python/pytest repositories."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
resolv = "resolv.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resolv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
