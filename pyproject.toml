[project]
name = "resolv"
version = "0.1.0"
description = "Turn a bug report into a reproduced, validated, reviewable patch for Python/pytest repositories."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
service = ["flask>=3.0", "sqlalchemy>=2.0", "pyjwt[crypto]>=2.8"]
postgres = ["psycopg[binary]>=3.1"]
s3 = ["boto3>=1.34"]

[project.scripts]
resolv = "resolv.cli:main"
resolv-service = "resolv.service.cli:main"
resolv-bench = "resolv.bench.cli:main"

[dependency-groups]
dev = ["pytest>=8", "resolv[service]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resolv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
